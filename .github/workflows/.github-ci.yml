name: Pytest

on:
  repository_dispatch:
    types: [run-tests]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.13'
    
    - name: Get data from webhook
      run: |
        echo "ADAPTER_MODE=${{ github.event.client_payload.adapter_mode }}" >> $GITHUB_ENV
        echo "TMS_URL=${{ github.event.client_payload.url }}" >> $GITHUB_ENV
        echo "TEST_RUN_ID=${{ github.event.client_payload.test_run_id }}" >> $GITHUB_ENV
        echo "PROJECT_ID=${{ github.event.client_payload.project_id }}" >> $GITHUB_ENV
        echo "CONFIGURATION_IDS=${{ github.event.client_payload.configuration_id[0] }}" >> $GITHUB_ENV
    
    - name: Install dependencies (adapterMode=0 or 2)
      if: env.ADAPTER_MODE == '0' || env.ADAPTER_MODE == '2'
      run: |
        python -m pip install --upgrade pip
        pip install testit-adapter-pytest==3.12.0
    
    - name: Install dependencies (adapterMode=1 + CLI)
      if: env.ADAPTER_MODE == '1'
      run: |
        python -m pip install --upgrade pip
        pip install testit-adapter-pytest==3.12.0
        pip install testit-cli==2.8.1

    - name: Run tests (adapterMode=2)
      if: env.ADAPTER_MODE == '2'
      run: |
        export TMS_TOKEN=${{ secrets.TMS_PRIVATE_TOKEN }}
        pytest \
          --tmsUrl=$TMS_URL \
          --tmsPrivateToken=${{ secrets.TMS_PRIVATE_TOKEN }} \
          --tmsProjectId=$PROJECT_ID \
          --tmsConfigurationId=$CONFIGURATION_IDS \
          --tmsTestRunName="Запуск всех автотестов (adapterMode=2)" \
          --tmsAdapterMode=2 \
          --tmsCertValidation=false \
          --testit

    - name: Setup TestIT filter (adapterMode=1)
      if: env.ADAPTER_MODE == '1'
      run: |
        export TMS_TOKEN=${{ secrets.TMS_PRIVATE_TOKEN }}
        testit autotests_filter \
          --url $TMS_URL \
          --configuration-id $CONFIGURATION_IDS \
          --testrun-id $TEST_RUN_ID \
          --framework pytest \
          --disable-cert-validation \
          --output tmp/filter.txt

    - name: Run filtered tests (adapterMode=1)
      if: env.ADAPTER_MODE == '1'
      run: |
        export TMS_TOKEN=${{ secrets.TMS_PRIVATE_TOKEN }}
        pytest "$(cat tmp/filter.txt)" \
          --tmsUrl=$TMS_URL \
          --tmsPrivateToken=${{ secrets.TMS_PRIVATE_TOKEN }} \
          --tmsProjectId=$PROJECT_ID \
          --tmsConfigurationId=$CONFIGURATION_IDS \
          --tmsTestRunId=$TEST_RUN_ID \
          --tmsTestRunName="Запуск автотестов с фильтром (adapterMode=1 + Test IT CLI)" \
          --tmsAdapterMode=1 \
          --tmsCertValidation=false \
          --testit    

    - name: Run tests (adapterMode=0)
      if: env.ADAPTER_MODE == '0'
      run: |
        export TMS_TOKEN=${{ secrets.TMS_PRIVATE_TOKEN }}
        pytest \
          --tmsUrl=$TMS_URL \
          --tmsPrivateToken=${{ secrets.TMS_PRIVATE_TOKEN }} \
          --tmsProjectId=$PROJECT_ID \
          --tmsConfigurationId=$CONFIGURATION_IDS \
          --tmsTestRunId=$TEST_RUN_ID \
          --tmsTestRunName="Запуск автотестов с фильтром (adapterMode=0)" \
          --tmsAdapterMode=0 \
          --tmsCertValidation=false \
          --testit
    


    
    