name: Pytest

on:
  repository_dispatch:
    types: [run-tests]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.13'

    - name: Get data from webhook
      run: |
        echo "ADAPTER_MODE=${{ github.event.client_payload.adapter_mode }}" >> $GITHUB_ENV
        echo "TMS_URL=${{ github.event.client_payload.url }}" >> $GITHUB_ENV
        echo "TEST_RUN_ID=${{ github.event.client_payload.test_run_id }}" >> $GITHUB_ENV
        echo "PROJECT_ID=${{ github.event.client_payload.project_id }}" >> $GITHUB_ENV
        echo "CONFIGURATION_IDS=${{ github.event.client_payload.configuration_id[0] }}" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install testit-adapter-pytest testit-cli

    - name: Download sync-storage
      run: |
        mkdir -p .caches
        # Получаем JSON последнего релиза
        RELEASE_JSON=$(curl -s "https://api.github.com/repos/testit-tms/sync-storage-public/releases/latest")
        LATEST_VERSION=$(echo "$RELEASE_JSON" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
        if [ -z "$LATEST_VERSION" ]; then
          echo "Failed to get latest version"
          exit 1
        fi
        echo "Latest sync-storage version: $LATEST_VERSION"

        # Ищем актив для linux_amd64
        DOWNLOAD_URL=$(echo "$RELEASE_JSON" | grep -o '"browser_download_url": "[^"]*linux_amd64"' | sed -E 's/.*"([^"]+)".*/\1/')
        if [ -z "$DOWNLOAD_URL" ]; then
          echo "Could not find linux_amd64 binary in release"
          exit 1
        fi

        curl -L -o .caches/syncstorage-linux-amd64 "$DOWNLOAD_URL"
        chmod +x .caches/syncstorage-linux-amd64
        # Проверка, что скачан реальный исполняемый файл
        file .caches/syncstorage-linux-amd64 | grep -q "ELF.*executable" || { echo "Downloaded file is not an executable"; cat .caches/syncstorage-linux-amd64 | head -c 200; exit 1; }

    - name: Ensure test run exists (create if not provided)
      if: env.TEST_RUN_ID == ''
      run: |
        mkdir -p tmp
        BASE_URL="${{ env.TMS_URL }}"
        BASE_URL="${BASE_URL%/}"
        BODY=$(jq -nc \
          --arg projectId "${{ env.PROJECT_ID }}" \
          --arg name "CI/CD Test Run $(date +'%Y-%m-%d %H:%M:%S')" \
          '{projectId: $projectId, name: $name}')
        curl -sS -f -X POST "${BASE_URL}/api/v2/testRuns" \
          -H "accept: application/json" \
          -H "Content-Type: application/json" \
          -H "Authorization: PrivateToken ${{ secrets.TMS_PRIVATE_TOKEN }}" \
          -d "$BODY" \
          | jq -er '.id' > tmp/testrun_id.txt
        echo "TEST_RUN_ID=$(cat tmp/testrun_id.txt)" >> $GITHUB_ENV
        echo "TEST_RUN_ID=$(cat tmp/testrun_id.txt)" >> .env

    - name: Start sync-storage
      run: |
        nohup .caches/syncstorage-linux-amd64 \
          --testRunId ${{ env.TEST_RUN_ID }} \
          --port 49152 \
          --baseURL ${{ env.TMS_URL }} \
          --privateToken ${{ secrets.TMS_PRIVATE_TOKEN }} \
          > service.log 2>&1 &
        echo $! > syncstorage.pid
        sleep 3

    - name: Generate filter file (adapterMode=1 only)
      if: env.ADAPTER_MODE == '1'
      run: |
        mkdir -p tmp
        testit autotests_filter \
          --url ${{ env.TMS_URL }} \
          --configuration-id ${{ env.CONFIGURATION_IDS }} \
          --testrun-id ${{ env.TEST_RUN_ID }} \
          --framework pytest \
          --disable-cert-validation \
          --output tmp/filter.txt

    - name: Run tests
      run: |
        if [ "${{ env.ADAPTER_MODE }}" == "1" ]; then
          PYTEST_ARGS="$(cat tmp/filter.txt)"
        else
          PYTEST_ARGS="."
        fi
        TEST_RUN_LINKS=$(jq -nc \
          --arg runUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          '[{url: $runUrl, title: "GitHub Actions pipeline", type: "Related"}]')
        pytest $PYTEST_ARGS \
          --tmsUrl=${{ env.TMS_URL }} \
          --tmsPrivateToken=${{ secrets.TMS_PRIVATE_TOKEN }} \
          --tmsProjectId=${{ env.PROJECT_ID }} \
          --tmsConfigurationId=${{ env.CONFIGURATION_IDS }} \
          --tmsTestRunId=${{ env.TEST_RUN_ID }} \
          --tmsTestRunName="Test run from CI/CD" \
          --tmsTestRunLinks="$TEST_RUN_LINKS" \
          --tmsAdapterMode=${{ env.ADAPTER_MODE }} \
          --tmsCertValidation=false \
          --testit

    - name: Wait for sync-storage completion
      if: always()
      run: |
        curl -v "http://127.0.0.1:49152/wait-completion?testRunId=${{ env.TEST_RUN_ID }}" || true
        if [ -f syncstorage.pid ]; then
          kill $(cat syncstorage.pid) || true
        fi

    - name: Upload sync-storage logs (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: syncstorage-logs
        path: service.log